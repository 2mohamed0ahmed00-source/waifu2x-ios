name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version
          ls /Applications | grep -i xcode

      - name: List schemes
        run: xcodebuild -list -workspace waifu2x-ios.xcworkspace

      - name: Build unsigned app
        run: |
          xcodebuild -workspace waifu2x-ios.xcworkspace -scheme waifu2x-ios -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App: $APP_PATH"
          ls -la "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r waifu2x-ios-unsigned.ipa Payload
          ls -lh waifu2x-ios-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: waifu2x-ios-unsigned-ipa
          path: waifu2x-ios-unsigned.ipa
          if-no-files-found: error
