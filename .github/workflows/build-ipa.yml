name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select oldest Xcode 16
        run: |
          ls /Applications | grep -i xcode
          XCODE=$(ls -d /Applications/Xcode_16.*.app 2>/dev/null | head -n 1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -workspace waifu2x-ios.xcworkspace

      - name: Build unsigned app
        run: |
          xcodebuild -workspace waifu2x-ios.xcworkspace -scheme waifu2x-ios -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO IPHONEOS_DEPLOYMENT_TARGET=12.0 SWIFT_VERSION=5.0

      - name: Package IPA
        run: |
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App: $APP_PATH"
          ls -la "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r waifu2x-ios-unsigned.ipa Payload
          ls -lh waifu2x-ios-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: waifu2x-ios-unsigned-ipa
          path: waifu2x-ios-unsigned.ipa
          if-no-files-found: error
