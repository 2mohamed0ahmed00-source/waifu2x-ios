name: Test runners

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26, macos-26-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          uname -a
          sw_vers
          xcodebuild -version || true
